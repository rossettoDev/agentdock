services:
  Drupal\ab_core\PersonalWorkspaceProvisionerInterface:
    class: Drupal\ab_core\PersonalWorkspaceProvisioner
    arguments:
      - '@database'
      - '@entity_type.manager'
  Drupal\ab_core\Authorization\WorkspaceRolePolicy: ~
  Drupal\ab_core\Authorization\MembershipScope:
    arguments:
      - '@entity_type.manager'
      - '@Drupal\ab_core\Authorization\WorkspaceRolePolicy'
  Drupal\ab_core\Authorization\WorkspaceBoundary: ~
  Drupal\ab_core\Authorization\WorkspaceQueryScope:
    arguments:
      - '@Drupal\ab_core\Authorization\MembershipScope'
      - '@current_user'
  Drupal\ab_core\Authorization\HumanActorContextFactory:
    arguments:
      - '@current_user'
      - '@Drupal\ab_core\Authorization\MembershipScope'
  Drupal\ab_core\WorkspaceCreator:
    arguments:
      - '@database'
  Drupal\ab_core\UuidLookup:
    arguments:
      - '@entity_type.manager'
  Drupal\ab_core\WorkspaceRepository:
    arguments:
      - '@current_user'
      - '@entity_type.manager'
      - '@Drupal\ab_core\Authorization\MembershipScope'
      - '@Drupal\ab_core\UuidLookup'
  Drupal\ab_core\MembershipRepository:
    arguments:
      - '@current_user'
      - '@entity_type.manager'
      - '@Drupal\ab_core\Authorization\MembershipScope'
      - '@Drupal\ab_core\UuidLookup'
  cache_context.ab_memberships:
    class: Drupal\ab_core\Cache\MembershipsCacheContext
    arguments:
      - '@current_user'
      - '@Drupal\ab_core\Authorization\MembershipScope'
    tags:
      - { name: cache.context }
