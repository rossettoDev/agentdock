name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_pgsql, pgsql
          coverage: none
      
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      
      - name: Validate composer.json
        run: composer validate --strict
      
      - name: Run PHPCS
        run: |
          php vendor/bin/phpcs --standard=Drupal,DrupalPractice \
            --extensions=php,module,inc,install,test,profile,theme,info,yml \
            --ignore=*/tests/*,*/vendor/* \
            web/modules/custom web/themes/custom || true
      
      - name: Run PHPStan
        run: php vendor/bin/phpstan analyse || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: drupal11
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_pgsql, pgsql
          coverage: none
      
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      
      - name: Setup PostgreSQL
        run: |
          psql -h localhost -U postgres -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" drupal11
      
      - name: Run PHPUnit tests
        env:
          SIMPLETEST_DB: pgsql://postgres@localhost/drupal11
          SIMPLETEST_BASE_URL: http://localhost:8080
        run: |
          mkdir -p web/sites/simpletest/browser_output
          chmod 777 web/sites/simpletest/browser_output
          php -S localhost:8080 -t web &
          sleep 2
          php vendor/bin/phpunit
