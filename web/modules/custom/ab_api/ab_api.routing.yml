ab_api.workspaces:
  path: '/api/agent-board/v1/workspaces'
  defaults:
    _controller: '\Drupal\ab_api\Controller\ApiController::workspaces'
  methods: [GET]
  requirements:
    # The controller returns 401 when the caller has no credential.
    _access: 'TRUE'

ab_api.boards:
  path: '/api/agent-board/v1/workspaces/{workspace_id}/boards'
  defaults:
    _controller: '\Drupal\ab_api\Controller\ApiController::boards'
  methods: [GET]
  requirements:
    # The controller returns 401 when the caller has no credential.
    _access: 'TRUE'

ab_api.boards.create:
